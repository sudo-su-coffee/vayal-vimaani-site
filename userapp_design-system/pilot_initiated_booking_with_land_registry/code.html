                    "surface-dim": "#cbdbf5",
                    "error": "#ba1a1a",

                    "surface-tint": "#426558",

                    "on-tertiary": "#ffffff",

                    "surface-bright": "#f8f9ff",
                    "on-tertiary-container": "#689785",
                    "on-secondary-container": "#496f00",
                    "on-error": "#ffffff",
                    "inverse-primary": "#a9cfbe",
                    "secondary-container": "#b2f746",
                    "primary-fixed-dim": "#a9cfbe",
                    "outline": "#717974",
                    "on-primary-fixed": "#002117",
                    "surface": "#f8f9ff",
                    "outline-variant": "#c1c8c3",
                    "tertiary-fixed-dim": "#a0d1bd",
                    "surface-container-high": "#dce9ff",
                    "on-error-container": "#93000a",

            "borderRadius": {

            "fontFamily": {

                    "body-md": ["Inter"],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        input:focus {
            outline: none;
            border-color: #446900 !important;
        }
        .active-service {
            background-color: #b2f746;
            color: #121f00;
            border-color: #b2f746;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen pb-24">
<!-- Top App Bar -->
<header class="bg-surface sticky top-0 z-50 border-b border-outline-variant w-full h-16 flex justify-between items-center px-margin-mobile">
<div class="flex items-center gap-stack-md">
<span class="material-symbols-outlined text-primary">menu</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Raphael Aero-Agriculture</h1>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container-highest overflow-hidden">
<img alt="Pilot Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA4kpesWr51wX-jPUDbX7vZuuCScRyKYC7EMwssqSS-GbkvVPtEgZHv6nw5fB47icPjl7ByCX0jRQqDSzGnc1tuj0bN_JFlMVnbihzjGybrlucGO5hpoweh_fQsnOUQtbgqOCPItx5v66aIKhoB3X_jSOerd8-l1jycMHBENmuZjDy30G37G6CbHAEbS1Ef9oXHkUdtPDEP4ORMduSGAVnACh7N_iSdVbVEWtkseVAwM0Dp8KjX6ZFm4EgpUd0K8-YuUou-7HrLTbMQ"/>
</div>
</header>
<main class="px-margin-mobile pt-stack-md flex flex-col gap-stack-lg max-w-md mx-auto">
<!-- Section: Farmer Search -->
<section class="flex flex-col gap-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined" style="font-size: 14px;">search</span>
                FARMER IDENTIFICATION
            </label>
<div class="relative group">
<input class="w-full h-14 bg-surface border-b border-outline-variant px-4 font-body-lg text-body-lg text-on-surface transition-all focus:border-secondary" id="farmer-phone" placeholder="Enter mobile number" type="tel" value="9876543210"/>
<button class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-secondary active:scale-95 transition-transform" onclick="simulateSearch()">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-on-primary-container italic">Searching registry records...</p>
</section>
<!-- Section: Land Registry Details -->
<section class="flex flex-col gap-stack-md opacity-100 transition-opacity duration-500" id="registry-details">
<div class="flex justify-between items-center">
<h2 class="font-title-md text-title-md text-primary">Land Registry</h2>
<span class="bg-secondary-container text-on-secondary-container font-label-sm text-label-sm px-3 py-1 rounded-full flex items-center gap-1" id="subsidy-badge">
<span class="material-symbols-outlined" data-weight="fill" style="font-size: 16px;">verified</span>
                    Subsidy Partner
                </span>
</div>
<div class="grid grid-cols-2 gap-stack-md">
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant">STATE</label>
<input class="bg-surface-container-low border-b border-outline-variant p-2 font-body-md text-body-md rounded-t-sm" type="text" value="Maharashtra"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant">DISTRICT</label>
<input class="bg-surface-container-low border-b border-outline-variant p-2 font-body-md text-body-md rounded-t-sm" type="text" value="Nagpur"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant">BLOCK</label>
<input class="bg-surface-container-low border-b border-outline-variant p-2 font-body-md text-body-md rounded-t-sm" type="text" value="Katol"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant">SUBDIVISION</label>
<input class="bg-surface-container-low border-b border-outline-variant p-2 font-body-md text-body-md rounded-t-sm" type="text" value="Narkhed"/>
</div>
<div class="col-span-2 flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant">SURVEY NUMBER (KHASRA/PLOT)</label>
<input class="bg-surface-container-low border-b border-outline-variant p-2 font-body-md text-body-md rounded-t-sm" type="text" value="442/B - Sector 4"/>
</div>
</div>
<!-- Map Context -->
<div class="relative w-full h-32 rounded-xl overflow-hidden border border-outline-variant">
<div class="absolute inset-0 bg-slate-200">
<img class="w-full h-full object-cover" data-alt="A top-down satellite view of a lush agricultural field with clearly defined geometric plot boundaries. The image uses a clean, high-contrast palette of deep greens and earthy browns, characteristic of precise land management software. Soft natural light illuminates the terrain, emphasizing its texture and health." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBxFXu9ChkpfVCrZ6Z0eR-GC5s6pP103tHQQjbpgJGwewJs408hDrOR0DFCvhyQctBm6DODTIUQrfx9ziJvh1qO4VpJ_I74MXgnf9Ogz4BLuJC2WiW-dBrMZth8uLeK2KyJsMI1pMA2kZE9tklU-bZ-WlXIBJUYvmQ2E4E_0_cfWlQMhK9gAONNa2A80C2MQc2WfRbEUX_cw7WHocvLbKobvOMEVZQ5knnTsbfAPUxbH675pNUUx0IiFq_f8XP-DBzqabg6ucpgkvnt"/>
</div>
<div class="absolute top-2 right-2 glass-panel p-2 rounded-full border border-outline-variant">
<span class="material-symbols-outlined text-secondary">my_location</span>
</div>
<div class="absolute bottom-0 w-full glass-panel px-3 py-1 flex items-center justify-between">
<span class="font-label-sm text-label-sm text-primary">Verified Plot Area: 4.5 Ha</span>
<span class="material-symbols-outlined text-secondary" style="font-size: 18px;">layers</span>
</div>
</div>
</section>
<!-- Section: Service Selection -->
<section class="flex flex-col gap-stack-md">
<h2 class="font-title-md text-title-md text-primary">Mission Type</h2>
<div class="flex gap-stack-md">
<button class="flex-1 flex flex-col items-center gap-2 p-4 border border-outline-variant rounded-xl transition-all hover:bg-surface-container-high active-service" onclick="selectService(this)">
<span class="material-symbols-outlined text-display-lg" style="font-size: 32px;">water_drop</span>
<span class="font-label-sm text-label-sm">Spraying</span>
</button>
<button class="flex-1 flex flex-col items-center gap-2 p-4 border border-outline-variant rounded-xl transition-all hover:bg-surface-container-high" onclick="selectService(this)">
<span class="material-symbols-outlined text-display-lg" style="font-size: 32px;">map</span>
<span class="font-label-sm text-label-sm">Mapping</span>
</button>
</div>
</section>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary h-14 rounded-xl font-title-md text-title-md flex items-center justify-center gap-stack-sm active:scale-95 transition-transform mt-stack-sm shadow-lg">
            Proceed to Schedule
            <span class="material-symbols-outlined">event_available</span>
</button>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface h-20 pb-safe px-2 flex justify-around items-center shadow-[0_-1px_0_0_rgba(0,0,0,0.1)]">
<a class="flex flex-col items-center justify-center text-on-surface-variant active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined">calendar_month</span>
<span class="font-label-sm text-label-sm">Bookings</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined">payments</span>
<span class="font-label-sm text-label-sm">Payments</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</a>
</nav>
<script>
        function selectService(el) {
            const buttons = el.parentElement.querySelectorAll('button');
            buttons.forEach(btn => btn.classList.remove('active-service'));
            el.classList.add('active-service');
        }

        function simulateSearch() {
            const section = document.getElementById('registry-details');
            section.style.opacity = '0.3';
            setTimeout(() => {
                section.style.opacity = '1';
            }, 600);
        }

        // Handle navigation active states if multiple pages existed
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', (e) => {
                // This is a single page demo, but here is how we'd toggle
                document.querySelectorAll('nav a').forEach(l => {
                    l.className = "flex flex-col items-center justify-center text-on-surface-variant active:scale-90 transition-transform";
                });
                link.className = "flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 active:scale-90 transition-transform";
            });
        });
    </script>
</body></html>
