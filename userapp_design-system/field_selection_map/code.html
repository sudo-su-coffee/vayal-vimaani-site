<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Field Area Selection Map - Raphael Drones</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#a9cfbe",
                        "on-surface-variant": "#414845",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#bbedd8",
                        "surface-container-highest": "#d3e4fe",
                        "on-primary-fixed-variant": "#2a4d41",
                        "outline": "#717974",
                        "on-surface": "#0b1c30",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#334f00",
                        "tertiary-container": "#002d21",
                        "background": "#f8f9ff",
                        "on-secondary-fixed": "#121f00",
                        "surface-dim": "#cbdbf5",
                        "secondary-fixed-dim": "#98da27",
                        "secondary": "#446900",
                        "primary-fixed": "#c4ebda",
                        "surface-tint": "#426558",
                        "on-tertiary-fixed-variant": "#204f40",
                        "on-tertiary-container": "#689785",
                        "secondary-container": "#b2f746",
                        "on-secondary-container": "#496f00",
                        "on-primary-container": "#719586",
                        "surface-variant": "#d3e4fe",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#a0d1bd",
                        "inverse-primary": "#a9cfbe",
                        "surface-container-high": "#dce9ff",
                        "surface": "#f8f9ff",
                        "on-primary": "#ffffff",
                        "primary": "#00150e",
                        "surface-bright": "#f8f9ff",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#b2f746",
                        "inverse-on-surface": "#eaf1ff",
                        "on-primary-fixed": "#002117",
                        "surface-container": "#e5eeff",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#eff4ff",
                        "tertiary": "#00160f",
                        "primary-container": "#062c21",
                        "on-error": "#ffffff",
                        "inverse-surface": "#213145",
                        "outline-variant": "#c1c8c3",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed": "#002117",
                        "on-background": "#0b1c30"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "unit": "4px",
                        "stack-md": "16px",
                        "stack-lg": "32px",
                        "margin-desktop": "64px",
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "data-display": ["JetBrains Mono"],
                        "title-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "label-sm": ["JetBrains Mono"],
                        "display-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "data-display": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom map grid overlay for industrial feel */
        .map-grid {
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 100px 100px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-screen flex flex-col overflow-hidden antialiased">
<!-- TopAppBar (Suppressed navigation shell per task-focused rule, keeping brand header) -->
<header class="bg-surface dark:bg-on-surface flex justify-between items-center w-full px-margin-mobile py-unit max-w-7xl mx-auto border-b border-outline-variant dark:border-on-surface-variant relative z-10 docked full-width top-0">
<div class="flex items-center gap-stack-sm">
<button aria-label="Go back" class="p-2 rounded-full text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-on-surface-variant transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">agriculture</span>
<h1 class="text-title-md font-title-md font-bold text-on-surface dark:text-surface uppercase tracking-wide">Raphael Drones</h1>
</div>
</div>
<div class="flex items-center">
<button aria-label="Notifications" class="p-2 rounded-full text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-on-surface-variant transition-colors">
<span class="material-symbols-outlined">notifications</span>
</button>
</div>
</header>
<!-- Main Map Canvas -->
<main class="flex-1 relative w-full h-full bg-slate-900 overflow-hidden cursor-crosshair">
<!-- Satellite Map Background -->
<div class="absolute inset-0 bg-cover bg-center opacity-90 transition-transform duration-1000 ease-out transform scale-105" data-alt="High-resolution aerial satellite view of expansive agricultural farmlands. The terrain features a precise patchwork of varying crop fields in earthy greens and deep soil browns. The lighting is bright and clear daylight, providing crisp details of the field boundaries, tractor paths, and topographical textures. The overall aesthetic is realistic, data-rich, and suitable for a precision agriculture enterprise platform." data-location="Central Valley Farmland" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBzWY69rV9Os3ayFT0eC_4YHUdJeKU9kDf_TAm5IzQCHyrNg3G3lQ7PpHI94-u27rSfpsENh-kcbQ2k6ifQLCAcoQCOVxV1DaLHQHaba6vKZncj2ufi6MAZQh0OQZmcKU-1zO8KEJWCLuHuWi9c36_07zoKz0UhCBktou9nLr-qu5qORhVdZw_kip6WeIP7jbVUpn6NEE06jj6oV60wslLyLB5EgmhRzRxEn1j5e_ToLEeJ3BbKKQ5kv_mWH9ZFLGCP-wGFZlGEDwQ7');">
</div>
<!-- Ambient Tech Grid Overlay -->
<div class="absolute inset-0 map-grid pointer-events-none"></div>
<!-- Active Polygon Tool Overlay (4.2 Acre Selection) -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center">
<svg class="w-full h-full" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1000 800">
<!-- Outer glow/shadow -->
<polygon fill="none" filter="blur(4px)" points="300,200 650,150 750,450 450,600 250,450" stroke="rgba(0,0,0,0.2)" stroke-width="8"></polygon>
<!-- Main Polygon Selection -->
<polygon class="fill-secondary-fixed/30 stroke-secondary-fixed" points="300,200 650,150 750,450 450,600 250,450" stroke-linejoin="round" stroke-width="3"></polygon>
<!-- Polygon Vertices (Interaction points) -->
<circle class="fill-surface-container-lowest stroke-secondary-fixed" cx="300" cy="200" r="6" stroke-width="2"></circle>
<circle class="fill-surface-container-lowest stroke-secondary-fixed" cx="650" cy="150" r="6" stroke-width="2"></circle>
<circle class="fill-surface-container-lowest stroke-secondary-fixed" cx="750" cy="450" r="6" stroke-width="2"></circle>
<circle class="fill-surface-container-lowest stroke-secondary-fixed" cx="450" cy="600" r="6" stroke-width="2"></circle>
<circle class="fill-surface-container-lowest stroke-secondary-fixed" cx="250" cy="450" r="6" stroke-width="2"></circle>
<!-- Area Label hovering near polygon center -->
<g transform="translate(480, 360)">
<rect class="fill-surface-container-lowest/90" height="30" rx="4" width="90" x="-45" y="-15"></rect>
<text class="font-label-sm text-label-sm fill-on-surface font-bold uppercase" text-anchor="middle" x="0" y="5">4.2 Acres</text>
</g>
</svg>
</div>
<!-- Map Controls (Floating Top Right) -->
<div class="absolute top-stack-md right-margin-mobile md:right-stack-lg flex flex-col gap-stack-sm z-20">
<button aria-label="Map Layers" class="w-10 h-10 bg-surface-container-lowest/95 backdrop-blur-sm border border-outline-variant/50 rounded-full shadow-lg flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">layers</span>
</button>
<div class="w-10 bg-surface-container-lowest/95 backdrop-blur-sm border border-outline-variant/50 rounded-full shadow-lg flex flex-col overflow-hidden">
<button aria-label="Zoom In" class="w-10 h-10 flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors group border-b border-outline-variant/30">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">add</span>
</button>
<button aria-label="Zoom Out" class="w-10 h-10 flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">remove</span>
</button>
</div>
<button aria-label="My Location" class="w-10 h-10 bg-surface-container-lowest/95 backdrop-blur-sm border border-outline-variant/50 rounded-full shadow-lg flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors group mt-2">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">my_location</span>
</button>
</div>
<!-- Contextual Bottom Info Panel / Action Bar (Glassmorphism Bento Style) -->
<div class="absolute bottom-margin-mobile md:bottom-stack-lg left-1/2 transform -translate-x-1/2 w-[calc(100%-2*16px)] md:max-w-4xl bg-surface-container-lowest/85 backdrop-blur-md border border-outline-variant/40 rounded-xl shadow-2xl p-stack-md z-30 transition-all duration-300 hover:bg-surface-container-lowest/95">
<div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-stack-md">
<!-- Telemetry / Data Density Area -->
<div class="flex flex-row items-center gap-stack-lg flex-1 w-full md:w-auto">
<!-- Selected Area Data -->
<div class="flex flex-col flex-1 md:flex-none md:pr-stack-lg md:border-r border-outline-variant/50">
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider mb-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">architecture</span>
                            Selected Area
                        </span>
<div class="flex items-baseline gap-1">
<span class="font-data-display text-data-display text-on-surface tracking-tight">4.2</span>
<span class="font-body-md text-body-md text-on-surface-variant">Acres</span>
</div>
</div>
<!-- Estimated Resources Data -->
<div class="flex flex-col flex-1 md:flex-none">
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider mb-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">water_drop</span>
                            Est. Pesticide
                        </span>
<div class="flex items-baseline gap-1">
<span class="font-data-display text-data-display text-on-surface tracking-tight">120</span>
<span class="font-body-md text-body-md text-on-surface-variant">Gal</span>
</div>
</div>
</div>
<!-- Primary Action CTA -->
<div class="w-full md:w-auto mt-4 md:mt-0 flex-shrink-0">
<button class="w-full md:w-auto bg-primary text-on-primary hover:bg-primary-container hover:text-on-primary-container px-8 py-4 rounded-lg font-title-md text-title-md transition-all duration-200 flex items-center justify-center gap-2 shadow-md hover:shadow-lg ring-1 ring-primary/20">
                        Confirm Area
                        <span class="material-symbols-outlined">check_circle</span>
</button>
</div>
</div>
<!-- Minimal Progress/Status indicator -->
<div class="w-full h-1 bg-surface-variant rounded-full mt-stack-md overflow-hidden">
<div class="h-full bg-secondary-fixed w-full transform origin-left transition-transform duration-500 ease-out"></div>
</div>
</div>
</main>
</body></html>
