<!-- Script for Loading Micro-Interaction -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const loadingBar = document.getElementById('loading-bar');
            const percentText = document.getElementById('loading-percentage');
            let progress = 0;

            const updateProgress = () => {
                if (progress < 100) {
                    // Random technical-feeling increments
                    const increment = Math.floor(Math.random() * 15) + 5;
                    progress = Math.min(progress + increment, 100);
                    
                    loadingBar.style.width = `${progress}%`;
                    percentText.innerText = `${progress}%`;
                    
                    // Slower at the end for "checking sensors" feel
                    const nextTick = progress > 80 ? 800 : 300;
                    setTimeout(updateProgress, nextTick);
                }
            };

            setTimeout(updateProgress, 500);
        });
    </script>
