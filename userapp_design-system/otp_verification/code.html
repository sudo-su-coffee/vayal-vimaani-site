<input class="otp-input w-full aspect-square text-center font-data-display text-data-display border-b-2 border-outline-variant bg-transparent focus:outline-none transition-all" data-index="0" inputmode="numeric" maxlength="1" pattern="\d*" type="text">
<input class="otp-input w-full aspect-square text-center font-data-display text-data-display border-b-2 border-outline-variant bg-transparent focus:outline-none transition-all" data-index="1" inputmode="numeric" maxlength="1" pattern="\d*" type="text">
<input class="otp-input w-full aspect-square text-center font-data-display text-data-display border-b-2 border-outline-variant bg-transparent focus:outline-none transition-all" data-index="2" inputmode="numeric" maxlength="1" pattern="\d*" type="text">
<input class="otp-input w-full aspect-square text-center font-data-display text-data-display border-b-2 border-outline-variant bg-transparent focus:outline-none transition-all" data-index="3" inputmode="numeric" maxlength="1" pattern="\d*" type="text">
<input class="otp-input w-full aspect-square text-center font-data-display text-data-display border-b-2 border-outline-variant bg-transparent focus:outline-none transition-all" data-index="4" inputmode="numeric" maxlength="1" pattern="\d*" type="text">
<input class="otp-input w-full aspect-square text-center font-data-display text-data-display border-b-2 border-outline-variant bg-transparent focus:outline-none transition-all" data-index="5" inputmode="numeric" maxlength="1" pattern="\d*" type="text">

</span>

                            Resend Code
                        </button>
</p>

</div>

<script>
        // OTP Input Logic
        const inputs = document.querySelectorAll('.otp-input');
        const resendBtn = document.getElementById('resend-btn');
        const timerContainer = document.getElementById('timer-container');
        const timerSpan = document.getElementById('timer');

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Simple Countdown Timer
        let timeLeft = 59;
        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerContainer.classList.add('hidden');
                resendBtn.classList.remove('hidden');
            } else {
                timeLeft--;
                const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                timerSpan.textContent = `00:${seconds}`;
            }
        }, 1000);

        // Form Submit Simulation
        document.getElementById('otp-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const otp = Array.from(inputs).map(i => i.value).join('');
            if (otp.length === 6) {
                const btn = e.target.querySelector('button[type="submit"]');
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Verifying...';
                btn.disabled = true;
                setTimeout(() => {
                    alert('OTP Verified Successfully');
                    btn.innerHTML = 'Verified <span class="material-symbols-outlined">check_circle</span>';
                }, 1500);
            } else {
                alert('Please enter all 6 digits');
            }
        });

        // Resend Button Click
        resendBtn.addEventListener('click', () => {
            alert('A new code has been sent to your registered mobile number.');
            // Reset logic could go here
        });
    </script>
