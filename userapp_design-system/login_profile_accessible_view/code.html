<script>
    // Step navigation
    function showStep(step) {
        const steps = ['login', 'otp', 'profile'];
        const titles = {
            'login': 'Welcome Back',
            'otp': 'Verify Mobile',
            'profile': 'Complete Profile'
        };
        const subtitles = {
            'login': 'Access your precision aero-agriculture dashboard',
            'otp': 'We just sent a security code to your mobile device',
            'profile': 'Tell us a bit about your operations'
        };

        steps.forEach(s => {
            document.getElementById(`step-${s}`).classList.add('hidden-flow');
        });
        
        document.getElementById(`step-${step}`).classList.remove('hidden-flow');
        document.getElementById('flow-title').innerText = titles[step];
        document.getElementById('flow-subtitle').innerText = subtitles[step];
        
        if(step === 'otp') {
            document.querySelectorAll('.otp-input')[0].focus();
        }
    }

    // Phone input formatting
    const mobileInput = document.getElementById('mobile');
    mobileInput.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 10) value = value.slice(0, 10);
        if (value.length > 6) {
            e.target.value = `(${value.slice(0, 3)}) ${value.slice(3, 6)}-${value.slice(6)}`;
        } else if (value.length > 3) {
            e.target.value = `(${value.slice(0, 3)}) ${value.slice(3)}`;
        } else if (value.length > 0) {
            e.target.value = `(${value}`;
        } else {
            e.target.value = value;
        }
    });

    // OTP auto-advance
    const otpInputs = document.querySelectorAll('.otp-input');
    otpInputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            if (e.target.value && index < otpInputs.length - 1) {
                otpInputs[index + 1].focus();
            }
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !e.target.value && index > 0) {
                otpInputs[index - 1].focus();
            }
        });
    });

    // Atmospheric parallax
    document.addEventListener('mousemove', (e) => {
        const moveX = (e.clientX - window.innerWidth / 2) * 0.005;
        const moveY = (e.clientY - window.innerHeight / 2) * 0.005;
        document.querySelector('.bg-mesh').style.backgroundPosition = `${moveX}px ${moveY}px`;
    });
</script>
