<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Service Booking - Raphael Drones</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-fixed-dim": "#a9cfbe",
                      "on-surface-variant": "#414845",
                      "on-error-container": "#93000a",
                      "tertiary-fixed": "#bbedd8",
                      "surface-container-highest": "#d3e4fe",
                      "on-primary-fixed-variant": "#2a4d41",
                      "outline": "#717974",
                      "on-surface": "#0b1c30",
                      "error": "#ba1a1a",
                      "on-secondary-fixed-variant": "#334f00",
                      "tertiary-container": "#002d21",
                      "background": "#f8f9ff",
                      "on-secondary-fixed": "#121f00",
                      "surface-dim": "#cbdbf5",
                      "secondary-fixed-dim": "#98da27",
                      "secondary": "#446900",
                      "primary-fixed": "#c4ebda",
                      "surface-tint": "#426558",
                      "on-tertiary-fixed-variant": "#204f40",
                      "on-tertiary-container": "#689785",
                      "secondary-container": "#b2f746",
                      "on-secondary-container": "#496f00",
                      "on-primary-container": "#719586",
                      "surface-variant": "#d3e4fe",
                      "surface-container-lowest": "#ffffff",
                      "tertiary-fixed-dim": "#a0d1bd",
                      "inverse-primary": "#a9cfbe",
                      "surface-container-high": "#dce9ff",
                      "surface": "#f8f9ff",
                      "on-primary": "#ffffff",
                      "primary": "#00150e",
                      "surface-bright": "#f8f9ff",
                      "on-tertiary": "#ffffff",
                      "secondary-fixed": "#b2f746",
                      "inverse-on-surface": "#eaf1ff",
                      "on-primary-fixed": "#002117",
                      "surface-container": "#e5eeff",
                      "error-container": "#ffdad6",
                      "surface-container-low": "#eff4ff",
                      "tertiary": "#00160f",
                      "primary-container": "#062c21",
                      "on-error": "#ffffff",
                      "inverse-surface": "#213145",
                      "outline-variant": "#c1c8c3",
                      "on-secondary": "#ffffff",
                      "on-tertiary-fixed": "#002117",
                      "on-background": "#0b1c30"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "unit": "4px",
                      "stack-md": "16px",
                      "stack-lg": "32px",
                      "margin-desktop": "64px",
                      "margin-mobile": "16px",
                      "gutter": "24px",
                      "stack-sm": "8px"
              },
              "fontFamily": {
                      "body-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "data-display": ["JetBrains Mono"],
                      "title-md": ["Hanken Grotesk"],
                      "headline-lg": ["Hanken Grotesk"],
                      "label-sm": ["JetBrains Mono"],
                      "display-lg": ["Hanken Grotesk"],
                      "headline-lg-mobile": ["Hanken Grotesk"]
              },
              "fontSize": {
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "data-display": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
              }
            }
          }
        }
    </script>
<style>
        /* Custom styles for radio button hiding and styling */
        .service-radio:checked + div {
            border-color: #00150e; /* primary */
            background-color: #e5eeff; /* surface-container */
        }
        .service-radio:checked + div .icon-container {
            color: #00150e;
        }
        .crop-checkbox:checked + div {
            background-color: #00150e; /* primary */
            color: #ffffff;
            border-color: #00150e;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col">
<!-- TopAppBar (Transactional Variant - Back intention) -->
<header class="bg-surface border-b border-outline-variant flex justify-between items-center w-full px-margin-mobile py-unit max-w-7xl mx-auto h-16 shrink-0">
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<div class="text-title-md font-title-md font-bold text-on-surface">Raphael Drones</div>
</div>
<div class="text-label-sm font-label-sm text-on-surface-variant hidden md:block">
            Step 1 of 3: Service Details
        </div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-3xl mx-auto px-margin-mobile py-stack-lg md:py-margin-desktop">
<div class="mb-stack-lg">
<h1 class="text-headline-lg-mobile font-headline-lg-mobile md:text-headline-lg md:font-headline-lg text-on-surface mb-stack-sm">Configure Service</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Select your required drone service, crop parameters, and ideal schedule.</p>
</div>
<form class="space-y-stack-lg pb-32">
<!-- Service Type Section -->
<section>
<h2 class="text-title-md font-title-md text-on-surface mb-stack-md">Service Type</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<label class="cursor-pointer relative">
<input checked="" class="service-radio sr-only" name="service_type" type="radio" value="pesticide">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-md flex items-start gap-4 transition-colors hover:bg-surface-container-low">
<div class="icon-container text-outline flex-shrink-0">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">bug_report</span>
</div>
<div>
<h3 class="text-body-lg font-body-lg font-semibold text-on-surface mb-1">Pesticide Application</h3>
<p class="text-label-sm font-label-sm text-on-surface-variant normal-case tracking-normal">Precision targeting for pest control.</p>
</div>
</div>
</label>
<label class="cursor-pointer relative">
<input class="service-radio sr-only" name="service_type" type="radio" value="fertilizer">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-md flex items-start gap-4 transition-colors hover:bg-surface-container-low">
<div class="icon-container text-outline flex-shrink-0">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">compost</span>
</div>
<div>
<h3 class="text-body-lg font-body-lg font-semibold text-on-surface mb-1">Fertilizer Spreading</h3>
<p class="text-label-sm font-label-sm text-on-surface-variant normal-case tracking-normal">Even distribution for optimal growth.</p>
</div>
</div>
</label>
<label class="cursor-pointer relative">
<input class="service-radio sr-only" name="service_type" type="radio" value="imaging">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-md flex items-start gap-4 transition-colors hover:bg-surface-container-low">
<div class="icon-container text-outline flex-shrink-0">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">satellite_alt</span>
</div>
<div>
<h3 class="text-body-lg font-body-lg font-semibold text-on-surface mb-1">Multispectral Imaging</h3>
<p class="text-label-sm font-label-sm text-on-surface-variant normal-case tracking-normal">NDVI and crop health analysis.</p>
</div>
</div>
</label>
<label class="cursor-pointer relative">
<input class="service-radio sr-only" name="service_type" type="radio" value="seeding">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-md flex items-start gap-4 transition-colors hover:bg-surface-container-low">
<div class="icon-container text-outline flex-shrink-0">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">agriculture</span>
</div>
<div>
<h3 class="text-body-lg font-body-lg font-semibold text-on-surface mb-1">Seed Sowing</h3>
<p class="text-label-sm font-label-sm text-on-surface-variant normal-case tracking-normal">Automated aerial seeding operations.</p>
</div>
</div>
</label>
</div>
</section>
<hr class="border-outline-variant/30">
<!-- Crop & Field Data Section -->
<section class="space-y-stack-md">
<div>
<h2 class="text-title-md font-title-md text-on-surface mb-stack-sm">Crop Type</h2>
<div class="flex flex-wrap gap-3">
<label class="cursor-pointer">
<input checked="" class="crop-checkbox sr-only" name="crop_type" type="radio" value="wheat">
<div class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant text-label-sm font-label-sm transition-colors hover:bg-surface-container-low">Wheat</div>
</label>
<label class="cursor-pointer">
<input class="crop-checkbox sr-only" name="crop_type" type="radio" value="corn">
<div class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant text-label-sm font-label-sm transition-colors hover:bg-surface-container-low">Corn</div>
</label>
<label class="cursor-pointer">
<input class="crop-checkbox sr-only" name="crop_type" type="radio" value="soybeans">
<div class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant text-label-sm font-label-sm transition-colors hover:bg-surface-container-low">Soybeans</div>
</label>
<label class="cursor-pointer">
<input class="crop-checkbox sr-only" name="crop_type" type="radio" value="cotton">
<div class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant text-label-sm font-label-sm transition-colors hover:bg-surface-container-low">Cotton</div>
</label>
<label class="cursor-pointer">
<input class="crop-checkbox sr-only" name="crop_type" type="radio" value="other">
<div class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant text-label-sm font-label-sm transition-colors hover:bg-surface-container-low">Other</div>
</label>
</div>
</div>
<div>
<label class="block text-title-md font-title-md text-on-surface mb-stack-sm" for="field_size">Field Size</label>
<div class="relative max-w-xs">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-4 pr-16 text-data-display font-data-display text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="field_size" name="field_size" placeholder="0.00" type="number">
<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
<span class="text-on-surface-variant text-label-sm font-label-sm">Acres</span>
</div>
</div>
</div>
</section>
<hr class="border-outline-variant/30">
<!-- Schedule Section -->
<section>
<h2 class="text-title-md font-title-md text-on-surface mb-stack-md">Schedule</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<div>
<label class="block text-label-sm font-label-sm text-on-surface-variant mb-2 uppercase" for="service_date">Preferred Date</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" style="font-variation-settings: 'FILL' 0;">calendar_month</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-12 pr-4 text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="service_date" name="service_date" type="date">
</div>
</div>
<div>
<label class="block text-label-sm font-label-sm text-on-surface-variant mb-2 uppercase" for="service_time">Preferred Time</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" style="font-variation-settings: 'FILL' 0;">schedule</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-12 pr-4 text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="service_time" name="service_time" type="time">
</div>
</div>
</div>
</section>
</form>
</main>
<!-- Fixed Action Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-outline-variant/30 p-stack-md z-50">
<div class="max-w-3xl mx-auto flex justify-end">
<button class="bg-primary text-on-primary rounded-full px-8 py-4 flex items-center gap-2 hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-lg" type="button">
<span class="text-label-sm font-label-sm uppercase">Next: Select Location</span>
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</div>
</body></html>
